name: 'RN Native-Toolchain Readiness Gate'
description: >
  Scans a React Native project's Node/Java/Gradle/AGP/Kotlin/compileSdk/Xcode toolchain
  against React Native's native-requirement baseline — via rn-dep-scanner `doctor` (current
  version) or `upgrade --to <target-version>` (a planned upgrade) — and posts the resulting
  READY/WARN/BLOCKED verdict as a PR comment (updated in place on re-runs).
author: 'rn-dep-scanner'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  target-version:
    description: >
      React Native version to check upgrade readiness against. Omit to run `doctor` against
      the currently installed React Native version instead of `upgrade --to`.
    required: false
  working-directory:
    description: 'Directory containing the React Native project to scan.'
    required: false
    default: '.'
  all-workspaces:
    description: >
      Scan every workspace package in the monorepo containing working-directory, not just
      working-directory itself, and post one PR comment covering all of them (overall verdict
      is the worst of any package's verdict). A no-op outside a workspace.
    required: false
    default: 'false'
  scanner-version:
    description: 'npm version of rn-dep-scanner to install.'
    required: false
    default: 'latest'
  size-base:
    description: >
      Path to a base `size measure` snapshot JSON. Setting `size-head` switches the action to
      bundle-size mode: it runs `size diff` instead of `doctor`/`upgrade`, posts a separate
      size comment, and fails the job when over budget or the snapshots are not comparable.
      Build the bundle and run `size measure` in an earlier workflow step — this action never
      builds your app.
    required: false
  size-head:
    description: 'Path to the head `size measure` snapshot JSON. Enables bundle-size mode.'
    required: false
  size-baseline-artifact:
    description: >
      Name of a workflow artifact holding the base `size measure` snapshot, uploaded by a run on
      the base branch of this repository (fork runs are ignored). Used when `size-base` is not
      set; when no usable artifact exists, a "not checked" comment is posted instead of a diff.
      Needs `actions: read`.
    required: false
  size-baseline-branch:
    description: 'Branch the baseline artifact must come from (default: the pull request base branch).'
    required: false
  size-budget:
    description: 'Optional budget JSON path (overrides `sizeBudget` in .rn-dep-scanner.json).'
    required: false
  github-token:
    description: 'Token used to read/post the PR comment. Needs `pull-requests: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'READY, WARN, or BLOCKED.'
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: 'composite'
  steps:
    - name: Install rn-dep-scanner
      shell: bash
      run: npm install --no-save "rn-dep-scanner@${{ inputs.scanner-version }}"

    - name: Run preflight scan
      id: scan
      if: ${{ inputs.size-head == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ALL_WORKSPACES_FLAG=""
        if [ "${{ inputs.all-workspaces }}" = "true" ]; then
          ALL_WORKSPACES_FLAG="--all-workspaces"
        fi
        if [ -n "${{ inputs.target-version }}" ]; then
          npx rn-dep-scanner upgrade --to "${{ inputs.target-version }}" --json $ALL_WORKSPACES_FLAG > rn-dep-scanner-result.json
          echo "kind=upgrade" >> "$GITHUB_OUTPUT"
        else
          npx rn-dep-scanner doctor --json $ALL_WORKSPACES_FLAG > rn-dep-scanner-result.json
          echo "kind=doctor" >> "$GITHUB_OUTPUT"
        fi
        # A `--all-workspaces` result has a top-level `workspaces[]` array instead of its own
        # `verdict` — roll up the worst of every package's verdict for the action's own output.
        VERDICT=$(node -e "
          const data = JSON.parse(require('fs').readFileSync('rn-dep-scanner-result.json', 'utf8'));
          const order = { READY: 0, WARN: 1, BLOCKED: 2 };
          if (Array.isArray(data.workspaces)) {
            console.log(data.workspaces.reduce((worst, p) => order[p.verdict] > order[worst] ? p.verdict : worst, 'READY'));
          } else {
            console.log(data.verdict);
          }
        ")
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ github.event_name == 'pull_request' && inputs.size-head == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: node "${{ github.action_path }}/scripts/post-pr-comment.mjs" rn-dep-scanner-result.json "${{ steps.scan.outputs.kind }}"

    - name: Fetch size baseline
      id: baseline
      if: ${{ inputs.size-head != '' && inputs.size-base == '' && inputs.size-baseline-artifact != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        SIZE_BASELINE_ARTIFACT: ${{ inputs.size-baseline-artifact }}
        SIZE_BASELINE_BRANCH: ${{ inputs.size-baseline-branch }}
      run: node "${{ github.action_path }}/scripts/fetch-size-baseline.mjs" rn-dep-scanner-size-base.json rn-dep-scanner-size-baseline.json

    - name: Run bundle size diff
      id: size
      if: ${{ inputs.size-head != '' && (inputs.size-base != '' || steps.baseline.outputs.status == 'found') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SIZE_BASE: ${{ inputs.size-base != '' && inputs.size-base || 'rn-dep-scanner-size-base.json' }}
        SIZE_HEAD: ${{ inputs.size-head }}
        SIZE_BUDGET: ${{ inputs.size-budget }}
      run: |
        set -uo pipefail
        BUDGET_ARGS=()
        if [ -n "$SIZE_BUDGET" ]; then BUDGET_ARGS=(--budget "$SIZE_BUDGET"); fi
        # Exits 1 over budget / not comparable; the comment must still be posted before failing.
        npx rn-dep-scanner size diff "$SIZE_BASE" "$SIZE_HEAD" --json ${BUDGET_ARGS[@]+"${BUDGET_ARGS[@]}"} > rn-dep-scanner-size.json
        echo "exit=$?" >> "$GITHUB_OUTPUT"

    - name: Post size PR comment
      if: ${{ always() && github.event_name == 'pull_request' && inputs.size-head != '' && steps.size.outcome != 'skipped' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: node "${{ github.action_path }}/scripts/post-pr-comment.mjs" rn-dep-scanner-size.json size

    - name: Post size baseline-missing PR comment
      if: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.status != '' && steps.baseline.outputs.status != 'found' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: node "${{ github.action_path }}/scripts/post-pr-comment.mjs" rn-dep-scanner-size-baseline.json size-baseline-missing

    - name: Fail when over size budget
      if: ${{ inputs.size-head != '' && steps.size.outcome != 'skipped' && steps.size.outputs.exit != '0' }}
      shell: bash
      run: |
        echo "::error::Bundle size is over budget or the snapshots are not comparable (see rn-dep-scanner-size.json / the PR comment)."
        exit 1

# Usage:
#
# - uses: <owner>/rn-dep-scanner@v1
#   with:
#     target-version: '0.87'    # optional; omit to check the currently installed RN version
#     all-workspaces: 'true'    # optional; scan every workspace package in the monorepo and
#                                # post one comment covering all of them (default: 'false')
#   permissions:
#     pull-requests: write
