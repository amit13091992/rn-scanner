name: Release

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret exists or is needed.
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions, with
# this repository and the workflow filename `release.yml`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 (Node 24 ships npm 11).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm audit --audit-level=high

      - name: Publish (provenance attached automatically by trusted publishing)
        run: npm publish --access public
