name: Preflight Dogfood

# Runs this repo's own `doctor` command + PR-comment pipeline against the minimal fixture
# project in .github/fixtures/sample-app, using the locally built dist/ (not an npm install
# of the action, since this repo's own unreleased changes are what's being exercised).
# This validates the scan + formatting + comment-posting mechanics end to end on every PR to
# this repo; it does not validate action.yml's `npm install rn-dep-scanner@<version>` step,
# which only runs once this package's changes are actually published.

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Run doctor against the dogfood fixture
        working-directory: .github/fixtures/sample-app
        run: node ../../../dist/index.js doctor --json > rn-dep-scanner-result.json

      - name: Post PR comment
        working-directory: .github/fixtures/sample-app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node ../../../scripts/post-pr-comment.mjs rn-dep-scanner-result.json doctor

      - name: Smoke-test doctor --all-workspaces against a throwaway 2-package workspace
        # Not posted as a PR comment (would collide with the single-package comment above,
        # since both share PR_COMMENT_MARKER) — this only validates that the --all-workspaces
        # CLI path itself runs and aggregates correctly in a real CI environment. The comment
        # *formatting* for this path is covered by test/prComment.test.ts.
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          mkdir -p "$WORKDIR/packages/shared" "$WORKDIR/packages/mobile-app"
          echo '{"name":"dogfood-root","private":true,"workspaces":["packages/*"]}' > "$WORKDIR/package.json"
          echo '{"name":"@dogfood/shared","version":"1.0.0"}' > "$WORKDIR/packages/shared/package.json"
          echo '{"name":"mobile-app","dependencies":{"react-native":"0.75.0","react":"18.3.1"}}' > "$WORKDIR/packages/mobile-app/package.json"
          echo '{"lockfileVersion":3,"packages":{"":{}}}' > "$WORKDIR/package-lock.json"
          node dist/index.js doctor --cwd "$WORKDIR/packages/mobile-app" --all-workspaces --json > all-workspaces-result.json
          node -e "
            const data = JSON.parse(require('fs').readFileSync('all-workspaces-result.json', 'utf8'));
            if (!Array.isArray(data.workspaces) || data.workspaces.length !== 2) {
              throw new Error('Expected a 2-package workspaces[] array, got: ' + JSON.stringify(data));
            }
            console.log('--all-workspaces aggregated', data.workspaces.length, 'packages as expected.');
          "
